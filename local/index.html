<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cockpit Trail Widget Local Preview</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    >
    <link rel="stylesheet" href="../src/widget.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #e2e8f0;
        font-family: "Segoe UI", sans-serif;
      }

      .page {
        max-width: 900px;
        margin: 20px auto;
        padding: 12px;
      }

      .hint {
        margin-bottom: 10px;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="hint">Local preview with mocked cockpit datalake updates.</div>
      <div id="widget-root"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./mock-cockpit.js"></script>
    <script>
      fetch("../src/widget.html")
        .then(function (res) { return res.text(); })
        .then(function (html) {
          document.getElementById("widget-root").innerHTML = html;
          var script = document.createElement("script");
          script.src = "../src/main.js";
          document.body.appendChild(script);
        });
    </script>
  </body>
</html>
